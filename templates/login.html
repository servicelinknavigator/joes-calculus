{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block content_noauth %}
<div class="login-page">
  <form class="login-card" method="post" action="{{ url_for('login') }}">
    <h1><span class="brand-mark"></span>Calculus</h1>
    <p class="login-sub">Log in om verder te gaan</p>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <label>E-mailadres
      <input type="email" name="email" required autofocus>
    </label>
    <label>Wachtwoord
      <input type="password" name="password" required>
    </label>
    <button type="submit">Inloggen</button>
  </form>
</div>
{% endblock %}
